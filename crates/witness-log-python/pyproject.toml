[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "witness-log"
description = "Cryptographic audit-trail log for autonomous agents — witnessed, not trusted."
requires-python = ">=3.9"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]

# The core has no Python dependencies. Each extra pulls in one integration;
# the floors are the versions the adapters are tested against in CI
# (`integrations` job). crewai pins mcp<2, so install `crewai` and `mcp`
# in separate environments.
[project.optional-dependencies]
mcp = ["mcp>=2"]
langchain = ["langchain-core>=1.0"]
crewai = ["crewai>=1.0"]
openai-agents = ["openai-agents>=0.20"]
langgraph = ["langgraph>=1.0", "langchain-core>=1.0"]
google-adk = ["google-adk>=2.0"]
pydantic-ai = ["pydantic-ai-slim>=2.0"]
autogen = ["autogen-agentchat>=0.7", "autogen-core>=0.7"]
llamaindex = ["llama-index-core>=0.14"]
# Every adapter except crewai (its mcp<2 pin conflicts with the mcp extra).
all-frameworks = [
    "langchain-core>=1.0",
    "langgraph>=1.0",
    "openai-agents>=0.20",
    "google-adk>=2.0",
    "pydantic-ai-slim>=2.0",
    "autogen-agentchat>=0.7",
    "autogen-core>=0.7",
    "llama-index-core>=0.14",
]

# witness-log-mcp needs the `mcp` extra; the other three are stdlib-only.
[project.scripts]
witness-log-mcp = "witness_log.mcp_server:main"
witness-log-mcp-proxy = "witness_log.mcp_proxy:main"
witness-log-hook = "witness_log.hook:main"
witness-log-hookd = "witness_log.hookd:main"

[project.urls]
Homepage = "https://github.com/0xAndersen/witness-log"
Specification = "https://github.com/0xAndersen/witness-log/blob/main/spec/SPEC.md"

[tool.maturin]
module-name = "witness_log._core"
python-source = "python"
features = ["pyo3/extension-module"]
