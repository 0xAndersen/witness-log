[package]
name = "witness-log-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "witness-log: offline verification CLI for witnessed audit logs and witness quorums."
readme = "../../README.md"
keywords = ["transparency-log", "audit", "merkle", "ai-agents", "c2sp"]
categories = ["cryptography", "command-line-utilities"]

[[bin]]
name = "witness-log"
path = "src/main.rs"

[dependencies]
witness-log-core = { version = "0.5.0", path = "../witness-log-core" }
witness-log-network = { version = "0.5.0", path = "../witness-log-network" }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
# `fleet` (RFC-0001, experimental): entries are stored and served as base64.
base64ct = { workspace = true }
# Used only by `witness-log demo` / `demo --tamper`, which generate
# throwaway in-memory keypairs to build a self-contained worked example.
# No key material generated here is ever written to disk.
ed25519-dalek = { workspace = true }
rand = { workspace = true }
# `witness serve`: state file names, and wiping the key buffer at init.
sha2 = { workspace = true }
zeroize = { workspace = true }
# `https://` witnesses and directory URLs for the built-in client (`witness
# submit`, `directory build --url`, `testnet`). rustls on ring with the
# Mozilla root set compiled in, so the binary needs no system OpenSSL or CA
# store. `--no-default-features` builds a plain-http-only binary.
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }

[target.'cfg(unix)'.dependencies]
# Restore SIGPIPE's default so `witness-log explain | head` exits quietly
# instead of panicking with a backtrace, and stop cleanly on SIGTERM so a
# witness releases its lock on a normal stop.
libc = "0.2"

[features]
default = ["https"]
https = ["dep:rustls", "dep:webpki-roots"]

[dev-dependencies]
# tests/https_witness.rs: a throwaway CA and a TLS-terminating proxy in
# front of real witnesses, to check the client's https path end to end.
rcgen = "0.14"
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
