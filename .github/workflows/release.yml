# Release: runs when a version tag (v*) is pushed, or on manual dispatch
# with the version to release (the workflow then creates the tag itself
# on the dispatched commit). Either way the tag must equal the workspace
# version in Cargo.toml, checked first, so a mistyped release cannot
# publish mismatched artifacts.
#
# Builds portable Python wheels (manylinux/musllinux, macOS, Windows; one
# abi3 wheel per platform covers CPython 3.9+), an sdist, and CLI binaries;
# publishes the Python package to PyPI via Trusted Publishing (no API token
# stored in the repo), and attaches everything to a GitHub Release.
#
# One-time setup on pypi.org before the first tag: Publishing -> add a
# "pending publisher" for project `witness-log`, owner `0xAndersen`,
# repository `witness-log`, workflow `release.yml`, environment `pypi`.
# crates.io publishing stays manual (see RELEASING.md): it needs a human to
# run `cargo publish` in dependency order.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.3.3 (must match Cargo.toml version)"
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check:
    name: tag matches Cargo.toml version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "Cargo.toml version: $v   release tag: $RELEASE_TAG"
          test "v$v" = "$RELEASE_TAG" || { echo "::error::tag $RELEASE_TAG does not match Cargo.toml version $v"; exit 1; }
          pv=$(grep -m1 '^version' crates/witness-log-python/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          test "$pv" = "$v" || { echo "::error::Python crate version $pv differs from workspace $v"; exit 1; }

  wheels:
    name: wheel ${{ matrix.os }} ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64, manylinux: auto }
          - { os: ubuntu-24.04, target: aarch64, manylinux: auto }
          - { os: ubuntu-24.04, target: x86_64, manylinux: musllinux_1_2 }
          - { os: macos-latest, target: x86_64, manylinux: "" }
          - { os: macos-latest, target: aarch64, manylinux: "" }
          - { os: windows-latest, target: x64, manylinux: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist --manifest-path crates/witness-log-python/Cargo.toml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux }}
          path: dist

  sdist:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist --manifest-path crates/witness-log-python/Cargo.toml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sdist
          path: dist

  cli:
    name: cli ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on 22.04 so the binaries need glibc 2.35 or older, not 24.04's 2.39.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, exe: witness-log }
          # Oracle Always Free (Ampere A1), Graviton, Raspberry Pi 4/5 (64-bit OS).
          # Missing before 0.3.6: cloud-init on an ARM VM had no binary to download.
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, exe: witness-log }
          - { os: macos-latest, target: aarch64-apple-darwin, exe: witness-log }
          - { os: macos-latest, target: x86_64-apple-darwin, exe: witness-log }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, exe: witness-log.exe }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p witness-log-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p out
          cp target/${{ matrix.target }}/release/${{ matrix.exe }} out/
          cp LICENSE README.md out/
          tar czf witness-log-${RELEASE_TAG}-${{ matrix.target }}.tar.gz -C out .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cli-${{ matrix.target }}
          path: witness-log-*.tar.gz

  publish-pypi:
    needs: [wheels, sdist]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write # Trusted Publishing; no token in the repo
    steps:
      # Python artifacts only, by name: the CLI archives are .tar.gz too and
      # must never reach PyPI.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true
          pattern: wheel-*
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sdist
          path: dist
      - run: ls -la dist && test "$(ls dist | grep -vcE '\.whl$|^witness_log-.*\.tar\.gz$')" = 0
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist

  github-release:
    needs: [wheels, sdist, cli]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write     # signs the build provenance (Sigstore)
      attestations: write # stores it with the repository
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: cd assets && sha256sum * > SHA256SUMS && cat SHA256SUMS
      # SLSA build provenance for every asset: `gh attestation verify
      # <file> --repo 0xAndersen/witness-log` proves it was built by this
      # workflow from this commit, not uploaded by hand.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: assets/*
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          # On manual dispatch there is no tag yet: the action creates it
          # at this commit. Tags created with the Actions token do not
          # re-trigger this workflow, so a dispatch never runs twice.
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: witness-log ${{ env.RELEASE_TAG }}
          files: assets/*
          generate_release_notes: true
      - name: Tag the Go module so `go get .../clients/go@vX.Y.Z` resolves
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/clients/go/${RELEASE_TAG}" -f sha="${GITHUB_SHA}" \
            || echo "::notice::clients/go/${RELEASE_TAG} not created (it may already exist)"
