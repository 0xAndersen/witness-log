name: npm (@witness-log/client)

# Builds and tests clients/typescript against the CLI and MCP server built
# from this commit; on a `ts-v<version>` tag, publishes it to npm with
# trusted publishing (OIDC, no token in the repository) and provenance.
#
# Publishing fails until the package's trusted publisher is configured on
# npmjs.com (Package settings -> Trusted publishing -> GitHub Actions:
# repository 0xAndersen/witness-log, workflow file npm.yml, environment
# npm). For a package that does not exist yet, npm requires one manual
# first publish before trusted publishing can be configured.

on:
  push:
    branches: [main]
    tags: ["ts-v*"]
    paths:
      - "clients/typescript/**"
      - "clients/package.json"
      - "clients/package-lock.json"
      - "crates/**"
      - "integrations/mcp/**"
      - ".github/workflows/npm.yml"
  pull_request:
    paths:
      - "clients/typescript/**"
      - "clients/package.json"
      - "clients/package-lock.json"
      - "crates/**"
      - "integrations/mcp/**"
      - ".github/workflows/npm.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test (node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Build the CLI
        run: cargo build --release -p witness-log-cli
      - name: Build and install the Python package with the MCP server
        working-directory: crates/witness-log-python
        run: |
          pip install maturin
          maturin build --release
          pip install "$(ls target/wheels/*.whl)[mcp]"
      - name: npm ci, build, test
        working-directory: clients/typescript
        env:
          WITNESS_LOG_BIN: ${{ github.workspace }}/target/release/witness-log
          WITNESS_LOG_PYTHON: python
        run: |
          npm ci          # the lockfile is the clients/ workspace's
          npm test

  publish:
    name: Publish to npm
    needs: test
    if: startsWith(github.ref, 'refs/tags/ts-v')
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write   # OIDC token for npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: npm >= 11.5.1 (trusted publishing)
        run: npm install -g npm@^11.5.1
      - name: Tag must match package.json version
        working-directory: clients/typescript
        run: |
          want="ts-v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json ($want)"
            exit 1
          fi
      - name: Build
        working-directory: clients/typescript
        run: npm ci && npm run build
      - name: Publish
        working-directory: clients/typescript
        run: npm publish --provenance --access public
        env:
          # First publish: an npm automation token in the `npm` environment (secret NPM_TOKEN).
          # Once the package exists and trusted publishing is configured, delete the secret;
          # an empty value falls back to OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
