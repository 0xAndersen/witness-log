name: retag

# One-off maintenance after a history rewrite (a commit's author address
# was corrected, which changes the hash of that commit and every later
# one): move release tags to the rewritten commits. A tag moves only to a
# commit on main whose tree is byte-for-byte the tree the tag pointed at,
# so the released source cannot change. Removed again once used.

on:
  workflow_dispatch:
    inputs:
      moves:
        description: "Space-separated tag=commit pairs, e.g. v0.6.1=<40-hex sha>"
        required: true
        type: string

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-24.04
    steps:
      - name: Move the tags
        env:
          GH_TOKEN: ${{ github.token }}
          MOVES: ${{ inputs.moves }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          api() { # gh api, with any failure reported as an annotation
            local out
            if ! out=$(gh api "$@" 2>&1); then
              echo "::error::gh api $1: $(printf '%s' "$out" | tr '\n' ' ' | cut -c1-400)" >&2; exit 1
            fi
            printf '%s\n' "$out"
          }
          for m in $MOVES; do
            tag=${m%%=*}; sha=${m#*=}
            [[ "$tag" =~ ^(clients/go/)?v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad tag $tag"; exit 1; }
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::bad commit $sha"; exit 1; }
            old=$(api "repos/$repo/git/ref/tags/$tag" --jq .object.sha)
            old_tree=$(api "repos/$repo/git/commits/$old" --jq .tree.sha)
            new_tree=$(api "repos/$repo/git/commits/$sha" --jq .tree.sha)
            [ "$old_tree" = "$new_tree" ] || { echo "::error::$tag: $sha has tree $new_tree, the tag's commit $old has $old_tree"; exit 1; }
            status=$(api "repos/$repo/compare/$sha...main" --jq .status)
            case "$status" in identical|ahead) ;; *) echo "::error::$sha is not on main ($status)"; exit 1 ;; esac
            api "repos/$repo/git/refs/tags/$tag" -X PATCH -f sha="$sha" -F force=true --jq '"\(.ref) -> \(.object.sha)"'
          done
