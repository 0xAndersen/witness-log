name: Overhead budget

# Per-call overhead (Rust append in memory and journaled without fsync,
# verify of a 10,000-leaf dossier, the Python @step decorator) against the
# committed baseline in benches/baseline.json. Fails if any metric's
# machine-normalised median regresses by more than the baseline's budget
# (20%). See crates/witness-log-network/benches/overhead.rs and
# benches/python_step.py for what is measured and how it is normalised.
#
# Runner: GitHub-hosted ubuntu-24.04 (x86_64). The committed baseline
# must come from the same runner type: run this workflow manually with
# update_baseline=true; that run commits benches/baseline.json to main.
# Only the commit job can write, and it runs no code from the change:
# the benchmarks themselves run with a read-only token.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_baseline:
        description: "Measure a new baseline on this runner and commit it to main instead of checking"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bench:
    name: Overhead budget (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Rust benchmark
        run: cargo bench -p witness-log-network --bench overhead -- --out "$GITHUB_WORKSPACE/target/bench-rust.json"
      - name: Python benchmark
        run: |
          pip install maturin
          (cd crates/witness-log-python && maturin build --release && pip install target/wheels/*.whl)
          python benches/python_step.py --out target/bench-python.json
      - name: Check against the committed baseline
        if: ${{ !inputs.update_baseline }}
        run: python benches/check_budget.py target/bench-rust.json target/bench-python.json
      - name: Write a new baseline
        if: ${{ inputs.update_baseline }}
        run: |
          python - <<'EOF'
          import json
          b = json.load(open("benches/baseline.json"))
          b["runner"] = "GitHub-hosted ubuntu-24.04"
          json.dump(b, open("benches/baseline.json", "w"), indent=2)
          EOF
          python benches/check_budget.py --update target/bench-rust.json target/bench-python.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ${{ inputs.update_baseline && 'bench-baseline' || 'bench-results' }}
          path: |
            target/bench-rust.json
            target/bench-python.json
            benches/baseline.json

  commit-baseline:
    name: Commit the new baseline
    needs: bench
    if: ${{ inputs.update_baseline }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: bench-baseline
          path: ${{ runner.temp }}/bench
      - run: |
          python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$RUNNER_TEMP/bench/benches/baseline.json"
          cp "$RUNNER_TEMP/bench/benches/baseline.json" benches/baseline.json
          git config user.name "0xAndersen"
          git config user.email "321999970+0xAndersen@users.noreply.github.com"
          git add benches/baseline.json
          git diff --cached --quiet && { echo "baseline unchanged"; exit 0; }
          git commit -m "bench: baseline measured on GitHub-hosted ubuntu-24.04"
          git pull --rebase origin main
          git push origin HEAD:main
