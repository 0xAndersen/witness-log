# Creates the Go module tag `clients/go/vX.Y.Z` (the module lives in a
# subdirectory, so `go get github.com/0xAndersen/witness-log/clients/go@vX.Y.Z`
# needs a tag with that prefix). The release workflow does this for every
# release; run this by hand to backfill one.
name: Go module tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag, e.g. v0.5.0 (the release tag it mirrors)"
        required: true
        type: string
      commit:
        description: "Commit to tag (default: the release tag's commit)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - name: Create clients/go/<tag>
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::tag must look like v1.2.3"; exit 1 ;; esac
          if [ -z "$COMMIT" ]; then
            COMMIT="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha)"
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/clients/go/${TAG}" -f sha="${COMMIT}" --jq .ref
