name: Go client

on:
  push:
    branches: [main]
    paths:
      - "clients/go/**"
      - "corpus/**"
      - "spec/**"
      - ".github/workflows/go.yml"
  pull_request:
    branches: [main]
    paths:
      - "clients/go/**"
      - "corpus/**"
      - "spec/**"
      - ".github/workflows/go.yml"

permissions:
  contents: read

jobs:
  go:
    name: vet, test, staticcheck (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: clients/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: clients/go/go.mod
          cache: false # stdlib only: there is no go.sum to key a cache on
      - name: gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go test
        # The conformance tests read ../../corpus and the goldens under
        # testdata/, which were produced by the Rust CLI (testdata/regen.sh).
        run: go test ./... -count=1
      - name: staticcheck
        shell: bash
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          "$(go env GOPATH)/bin/staticcheck" ./...
      - name: build the CLI
        run: go build ./cmd/witness-log-verify

  goldens-match-rust:
    # The goldens are committed, but the Rust CLI they came from moves. This
    # job re-verifies every golden with the current Rust CLI and the Go
    # verifier and compares the two reports, so the Go side cannot drift
    # from the reference without this failing.
    name: Go verdicts agree with the Rust CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: clients/go/go.mod
          cache: false
      - uses: dtolnay/rust-toolchain@stable
      - name: build both verifiers
        run: |
          cargo build -q -p witness-log-cli
          (cd clients/go && go build -o ../../target/witness-log-verify ./cmd/witness-log-verify)
      - name: compare reports
        run: clients/go/testdata/compare-with-rust.sh
