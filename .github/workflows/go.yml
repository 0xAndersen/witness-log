name: Go client

on:
  push:
    branches: [main]
    paths:
      - "clients/go/**"
      - "corpus/**"
      - "spec/**"
      - ".github/workflows/go.yml"
  pull_request:
    branches: [main]
    paths:
      - "clients/go/**"
      - "corpus/**"
      - "spec/**"
      - ".github/workflows/go.yml"

permissions:
  contents: read

jobs:
  go:
    name: vet, test, staticcheck (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: clients/go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: clients/go/go.mod
          cache: false # stdlib only: there is no go.sum to key a cache on
      - name: gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go test
        # The conformance tests read ../../corpus and the goldens under
        # testdata/, which were produced by the Rust CLI (testdata/regen.sh).
        run: go test ./... -count=1
      - name: staticcheck
        shell: bash
        # setup-go v6 exports GOTOOLCHAIN=local; staticcheck needs a newer
        # Go than the module's floor (go 1.22) to build, so let go fetch it
        # for this one install. Pinned so a staticcheck release cannot turn
        # main red overnight.
        env:
          GOTOOLCHAIN: auto
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          "$(go env GOPATH)/bin/staticcheck" ./...
      - name: build the CLI
        run: go build ./cmd/witness-log-verify

  goldens-match-rust:
    # The goldens are committed, but the Rust CLI they came from moves. This
    # job re-verifies every golden with the current Rust CLI and the Go
    # verifier and compares the two reports, so the Go side cannot drift
    # from the reference without this failing.
    name: Go verdicts agree with the Rust CLI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: clients/go/go.mod
          cache: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: build both verifiers
        run: |
          cargo build -q -p witness-log-cli
          (cd clients/go && go build -o ../../target/witness-log-verify ./cmd/witness-log-verify)
      - name: compare reports
        run: clients/go/testdata/compare-with-rust.sh

  reference-interop:
    # witness-log's C2SP notes checked by the libraries other transparency
    # logs and witnesses run (x/mod signed notes, transparency-dev/formats
    # cosignature/v1), not by witness-log's own parsers: the corpus vector
    # and a live testnet round through `c2sp export`. Issue #11.
    name: C2SP notes verify with the reference libraries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: clients/go/interop/go.mod
          cache-dependency-path: clients/go/interop/go.sum
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: build the CLI
        run: cargo build -q --release -p witness-log-cli
      - name: interop tests
        working-directory: clients/go/interop
        run: go test ./... -count=1 -v
