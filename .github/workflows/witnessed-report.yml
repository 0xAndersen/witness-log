name: witnessed-report

# Manual. Claims the first WITNESSED verdict against the public registry, or
# claims nothing. registry/witnessed_report.py builds the directory with
# `registry/build_directory.py --exclude-project`, counts distinct
# independent operator_org values and stops (green, no file) below 2.
# Otherwise it writes a real journal, runs `witness-log witness submit`
# against those witnesses and `witness-log verify --min-witnesses N`, and
# only on WITNESSED writes examples/swarm/reports/first-independent-witnessed.md,
# which this workflow commits. The dossier and directory are attached to
# the run so anyone can re-verify. An existing report is never overwritten.

on:
  workflow_dispatch:
    inputs:
      min_witnesses:
        description: "--min-witnesses for verify (2 or more)"
        required: false
        default: "2"
        type: string
      version:
        description: "witness-log release to use (latest or a tag like v0.3.5)"
        required: false
        default: latest
        type: string

permissions:
  contents: read

jobs:
  # Runs the release, the PyPI package and registered witnesses with a
  # read-only token; only the commit job below can write, and it runs none
  # of that code.
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      claimed: ${{ steps.report.outputs.claimed }}
    env:
      OUT: examples/swarm/reports/first-independent-witnessed.md
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: release CLI (provenance and SHA-256 checked)
        id: cli
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_IN: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="$VERSION_IN"
          if [ "$tag" = latest ]; then tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" -q .tag_name); fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::version must be latest or a tag like v1.2.3"; exit 1; }
          attested() { # v0.6.1 and later carry build provenance from release.yml
            local c=${1#v}; c=${c%%-*}; local a b p; IFS=. read -r a b p <<< "$c"
            [ "$a" -gt 0 ] || [ "$b" -gt 6 ] || { [ "$b" -eq 6 ] && [ "$p" -ge 1 ]; }
          }
          asset="witness-log-$tag-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p cli && cd cli
          curl -fsSLO "https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag/$asset"
          curl -fsSLO "https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag/SHA256SUMS"
          if attested "$tag"; then
            gh attestation verify SHA256SUMS --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --deny-self-hosted-runners
          fi
          grep " $asset\$" SHA256SUMS | sha256sum -c -
          tar xzf "$asset" ./witness-log
          ./witness-log --version
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Python package
        env:
          TAG: ${{ steps.cli.outputs.tag }}
        run: pip install -q "witness-log==${TAG#v}"
      - name: registry
        run: |
          python3 registry/validate.py
          python3 registry/build_directory.py --exclude-project | tee directory.json
      - name: report
        id: report
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MIN: ${{ inputs.min_witnesses }}
        run: |
          set -euo pipefail
          if [ -e "$OUT" ]; then
            echo "$OUT already exists; the first report is never overwritten. Writing to the run summary only."
            OUT=report-rerun.md
          fi
          python3 registry/witnessed_report.py --cli cli/witness-log --min-witnesses "$MIN" --out "$OUT" --work work
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          if [ -f "$OUT" ]; then cat "$OUT" >> "$GITHUB_STEP_SUMMARY"; else
            echo "Fewer than 2 independent operators are registered; nothing claimed." >> "$GITHUB_STEP_SUMMARY"; fi
          if [ "$OUT" = examples/swarm/reports/first-independent-witnessed.md ] && [ -f "$OUT" ]; then
            echo "claimed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: witnessed-report
          path: |
            work/dossier.json
            work/directory.json
            work/agent.jsonl
            ${{ env.OUT }}
          if-no-files-found: ignore

  commit:
    needs: report
    if: needs.report.outputs.claimed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      OUT: examples/swarm/reports/first-independent-witnessed.md
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: witnessed-report
          path: ${{ runner.temp }}/report
      - name: commit the report
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ ! -e "$OUT" ] || { echo "$OUT already exists; never overwritten"; exit 0; }
          src="$RUNNER_TEMP/report/$OUT"
          [ -f "$src" ] || src="$RUNNER_TEMP/report/$(basename "$OUT")"
          install -D -m 0644 "$src" "$OUT"
          git config user.name "0xAndersen"
          git config user.email "321999970+0xAndersen@users.noreply.github.com"
          git add "$OUT"
          git commit -m "reports: first independent WITNESSED verdict against the public registry"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          # The header reaches git through its environment: not in argv,
          # not in any config file.
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" git push origin "HEAD:$GITHUB_REF"
