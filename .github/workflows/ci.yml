name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Default to read-only. Individual jobs that need more (none currently do)
# should declare it explicitly at the job level, not rely on a broad
# workflow-level grant. See the pre-launch review, finding 24.
permissions:
  contents: read

# Every action is pinned to a full commit SHA, with the tag it was taken
# from in a comment (`@<sha> # v7`). Dependabot (.github/dependabot.yml)
# moves the pins monthly. A new action is pinned the same way: resolve the
# tag with `git ls-remote https://github.com/<owner>/<repo> refs/tags/<tag>`
# (use the `^{}` line for an annotated tag).

jobs:
  build-and-test:
    name: Build & test (Rust workspace)
    timeout-minutes: 45
    strategy:
      # One platform failing must not cancel the others: the point of the
      # matrix is to see every platform's result on every run.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Build (debug)
        run: cargo build --workspace --verbose
      - name: Test (debug)
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --verbose 2>&1 | tee test-debug.log || {
            # Surface the failing tests as annotations: job logs are not
            # always reachable, annotations are.
            grep -E "^test .* FAILED$|panicked at|^---- .* stdout ----$" test-debug.log | head -20 | sed 's/^/::error title=test failure (debug)::/'
            exit 1; }
      - name: Test (release)
        # debug_assert!-gated invariants (e.g. largest_power_of_two_lt_u64's
        # precondition check) are never exercised under --release, which is
        # the profile users actually ship. A bug that only a debug_assert
        # would catch could otherwise reach production undetected by CI.
        # See the pre-launch review, finding 24.
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --release --verbose 2>&1 | tee test-release.log || {
            grep -E "^test .* FAILED$|panicked at|^---- .* stdout ----$" test-release.log | head -20 | sed 's/^/::error title=test failure (release)::/'
            exit 1; }

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$version" ]; then
            echo "::error::rust-version not set in [workspace.package] -- add one so MSRV is enforced, not aspirational"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Build at declared MSRV
        # The published crates (core, network, cli) hold the MSRV. The wasm
        # crate is publish = false and built for the browser on stable by
        # pages.yml; wasm-bindgen 0.2.129 needs Rust 1.81.
        shell: bash
        run: |
          set -o pipefail
          if ! cargo build --workspace --exclude witness-log-wasm --color never 2>&1 | tee build.log; then
            # Job logs are not always reachable; surface the compiler's own words.
            grep -E "^(error|warning: unused)|requires rustc|cannot be built|-->" build.log | head -40 | while IFS= read -r line; do echo "::error::MSRV build: ${line}"; done
            exit 1
          fi

  lints:
    name: Clippy + rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: rustfmt (check only)
        run: cargo fmt --all -- --check
      - name: rustdoc (deny warnings)
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  conformance:
    name: Conformance corpus drift check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Regenerate corpus
        run: |
          cargo run -p witness-log-core --example generate_corpus
          cargo run -p witness-log-network --example generate_verdict_corpus
          cargo run -p witness-log-network --example generate_fleet_corpus
          cargo run -p witness-log-network --example generate_evidence_corpus
          cargo run -p witness-log-network --example generate_ed25519_corpus
          cargo run -p witness-log-network --example generate_parsing_corpus
      - name: The systemd unit cloud-init installs matches its pinned SHA-256
        run: |
          pin=$(grep -o 'UNIT_SHA256:-[0-9a-f]\{64\}' deploy/witness/cloud-init.yaml | cut -d- -f2)
          actual=$(sha256sum deploy/witness/witness-log-witness.service | cut -d' ' -f1)
          if [ "$pin" != "$actual" ]; then
            echo "::error::deploy/witness/witness-log-witness.service changed: update UNIT_SHA256 in cloud-init.yaml to $actual"
            exit 1
          fi
      - name: Fail if corpus drifted from committed vectors
        run: |
          git diff --exit-code corpus/ || \
          (echo "::error::Corpus vectors changed but were not committed. If this is an intentional wire-format change, update spec/SPEC.md and commit the regenerated corpus. See CONTRIBUTING.md." && exit 1)

  python-bindings:
    name: Python bindings (py${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest supported. The wheel is abi3 (stable ABI), so
        # one build must work on both -- testing only one version is how a
        # PyO3 "interpreter too new" failure ships unnoticed.
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install maturin and pytest
        # opentelemetry-sdk: tests/test_otel.py runs the span processor
        # against the real SDK (it is skipped where the SDK is missing).
        run: pip install maturin pytest opentelemetry-sdk
      - name: Build wheel
        working-directory: crates/witness-log-python
        run: maturin build --release
      - name: Install wheel
        working-directory: crates/witness-log-python
        run: pip install target/wheels/*.whl
      - name: Build the CLI (the Witnesser tests start real witnesses from it)
        run: cargo build --release -p witness-log-cli
      - name: Run pytest suite
        # Real coverage (exception hierarchy, dossier verification,
        # snapshot round-trip, file permissions) rather than one inline
        # smoke-test string -- see the pre-launch review, finding 19.
        working-directory: crates/witness-log-python
        shell: bash
        run: |
          pip install jsonschema
          set -o pipefail
          if ! pytest tests/ -v -ra 2>&1 | tee pytest.log; then
            # Job logs are not always reachable; name the failing tests.
            grep -E "^(FAILED|ERROR) " pytest.log | head -20 | while IFS= read -r line; do echo "::error::pytest (${{ matrix.python }}): ${line}"; done
            grep -E "^E   " pytest.log | head -10 | while IFS= read -r line; do echo "::error::pytest (${{ matrix.python }}): ${line}"; done
            exit 1
          fi
      - name: MCP server end to end (official client over stdio)
        # The MCP SDK requires Python >= 3.10; the bindings themselves
        # support 3.9, which the other steps cover.
        if: matrix.python != '3.9'
        run: |
          pip install "mcp>=2.2.0" anyio
          pytest -q integrations/mcp -p anyio
      - name: Docs that run (README, quickstarts, tutorials, troubleshooting)
        # Every code block marked <!-- doctest --> runs as written; a
        # quickstart that stops working fails here, not for a newcomer.
        # docs/tests checks the runner itself and that every page with a
        # marked block is on its list.
        run: |
          pytest -q docs/tests
          WITNESS_LOG_CLI=target/release/witness-log python docs/doctest.py
      - name: Three-organisation pilot (CLI only, --subject-org)
        run: WITNESS_LOG_BIN=target/release/witness-log python examples/pilot-triangle/run.py
      - name: Agent payments (x402 + AP2 profiles, bind, three disputes)
        # `make payments`: fails if any of its exit codes (0, 10, 20, 30, 40) changes.
        run: WITNESS_LOG_BIN=target/release/witness-log python examples/agent-payments/run.py
      - name: Live witness network (10 scenarios, 10 witnesses)
        run: python examples/live-network/scenarios.py
      - name: Swarm (100 scenarios, 12 witnesses, 25 agents)
        run: python examples/swarm/run.py --out swarm-report
      - name: Outside swarm (200 agents, 18 personas, 40 witnesses)
        # The full 1,000-agent run is ~4 minutes on two cores; CI runs a
        # fifth of it so a regression in any persona still shows up.
        run: |
          pip install "mcp>=2.2.0" anyio jsonschema
          export WL_BIN=target/release/witness-log
          python deploy/witness/fleet.py init fleet-a --count 20 --org "CI Operator A" --name-base a.witness.test/w --url-base http://127.0.0.1 --base-port 20000
          python deploy/witness/fleet.py init fleet-b --count 20 --org "CI Operator B" --name-base b.witness.test/w --url-base http://127.0.0.1 --base-port 20020
          python deploy/witness/fleet.py serve fleet-a --open-enrollment & echo $! > a.pid
          python deploy/witness/fleet.py serve fleet-b --open-enrollment & echo $! > b.pid
          sleep 3
          python -c "import json; w=json.load(open('fleet-a/directory.json'))['witnesses']+json.load(open('fleet-b/directory.json'))['witnesses']; json.dump({'witnesses': w}, open('directory.json','w'))"
          python examples/swarm/outside.py --agents 200 --directory directory.json --out swarm-report/outside --processes 4 --threads 12 --operator-serve-seconds 60
          # The gate checks itself: with a verifier that calls everything
          # WITNESSED, or witnesses that accept a fork, junk and an oversized
          # body, the same personas must fail the run, and on a failed
          # expectation, not a crash. (pytest covers this too, offline.)
          for fault in weak-verifier lax-witness; do
            if python examples/swarm/outside.py --agents 300 --only auditor,adversary,verifier_only --directory directory.json --out swarm-report/fault-$fault --processes 2 --threads 8 --inject-fault $fault; then
              echo "::error::outside.py --inject-fault $fault exited 0: its expectations do not gate the run"; exit 1
            fi
            grep -Eq '^- expectations checked: [0-9,]+; failed: [1-9]' swarm-report/fault-$fault/REPORT.md \
              || { echo "::error::outside.py --inject-fault $fault failed, but not on a failed expectation"; exit 1; }
          done
          kill $(cat a.pid) $(cat b.pid)
        if: matrix.python != '3.9'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: swarm-report-py${{ matrix.python }}
          path: |
            swarm-report/REPORT.md
            swarm-report/results.json
            swarm-report/outside/REPORT.md
            swarm-report/fault-*/REPORT.md

  integrations:
    # The framework adapters (witness_log.integrations.*) run each
    # framework's own tool-calling loop with a fake model. Kept out of the
    # gating jobs: these frameworks release weekly, and an upstream break
    # should show up here without blocking unrelated changes. crewai pins
    # mcp<2, so it gets its own environment.
    name: Framework adapters (${{ matrix.env }})
    runs-on: ubuntu-24.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        env: [langchain-openai-agents, crewai]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Build wheel
        working-directory: crates/witness-log-python
        run: pip install maturin pytest && maturin build --release
      - name: Install wheel with extras
        working-directory: crates/witness-log-python
        run: |
          whl=$(ls target/wheels/*.whl)
          if [ "${{ matrix.env }}" = crewai ]; then
            pip install "${whl}[crewai]"
          else
            pip install "${whl}[langchain,openai-agents]" langchain
          fi
      - name: Adapter tests (none may be skipped here)
        working-directory: crates/witness-log-python
        run: |
          set -o pipefail
          pytest -q -rs tests/test_integrations.py | tee out.txt
          if [ "${{ matrix.env }}" = crewai ]; then want=1; else want=2; fi
          grep -q "${want} passed" out.txt

  registry:
    name: Witness registry entries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest registry -q
      - run: python registry/validate.py --offline
      - run: python registry/build_directory.py > /dev/null

  cargo-deny:
    name: Supply chain audit (advisories + licenses)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
      # The Python crate is its own workspace; audit it too, or its
      # dependency tree (PyO3 and friends) is never checked.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          manifest-path: crates/witness-log-python/Cargo.toml
          arguments: --all-features --config deny.toml
      # So is the Node binding (napi-rs).
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          manifest-path: clients/node/Cargo.toml
          arguments: --all-features --config deny.toml
