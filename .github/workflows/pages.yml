name: Browser verifier (Pages)

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "crates/**"
      - "clients/go/**"
      - "corpus/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: page rendering test (no browser, no engine)
        run: node --test web/test/*.test.mjs
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: clients/go/go.mod
          cache: false
      - name: wasm-bindgen-cli (pinned to Cargo.toml)
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: build the Rust engine
        run: sh web/build.sh
      - name: build the Go engine
        run: sh web/build-go.sh
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: browser test
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
          python web/test/test_page.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: web

  # Deploys only once the owner has enabled Pages (Settings -> Pages ->
  # Source: GitHub Actions) and set the repository variable
  # PAGES_ENABLED=true; until then the build and browser test above still
  # run on every push and main stays green. See RELEASING.md.
  deploy:
    needs: build
    if: ${{ vars.PAGES_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
