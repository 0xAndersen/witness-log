name: Fuzz (scheduled)

on:
  schedule:
    - cron: "17 4 * * *" # daily
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target:
          - fuzz_dossier_verify
          - fuzz_checkpoint_verify
          - fuzz_journal_replay
          - fuzz_journal_damage
          - fuzz_merkle_proofs
          - fuzz_cli_render
          - fuzz_witness_request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Restore fuzz corpus cache
        # Coverage-guided fuzzing restarted from zero every run without
        # this -- a corpus that took days to build interesting inputs
        # into was thrown away nightly. See the pre-launch review,
        # finding 24.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz ${{ matrix.target }}
        # Raised from 300s: this is the nightly scheduled job, not a PR
        # check -- it isn't blocking anyone's merge, so it can afford to
        # run substantially longer per target for meaningfully better
        # coverage-guided exploration. See the pre-launch review, finding 24.
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=1800
      - name: Upload any crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz/artifacts/
