name: wiki
# Publishes docs/wiki/ to the GitHub wiki on every change (and on demand).
# The wiki repository exists only after one page has been created in the
# wiki UI; until then this job reports that and exits cleanly.
on:
  push:
    branches: [main]
    paths: ["docs/wiki/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Publish docs/wiki to the wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # The token reaches git as a header through its environment: never
          # in a URL (which git would store in /tmp/wiki/.git/config), argv
          # or a config file.
          WIKI="https://github.com/${GITHUB_REPOSITORY}.wiki.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          if ! git ls-remote "$WIKI" >/dev/null 2>&1; then
            echo "::warning::Wiki repository does not exist yet. Create any page at https://github.com/${GITHUB_REPOSITORY}/wiki once, then re-run this workflow."
            exit 0
          fi
          git clone "$WIKI" /tmp/wiki
          rsync -a --delete --exclude .git --exclude README.md docs/wiki/ /tmp/wiki/
          cd /tmp/wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "wiki already up to date"; exit 0; }
          git commit -m "wiki: sync from docs/wiki @ ${GITHUB_SHA::7}"
          git push
