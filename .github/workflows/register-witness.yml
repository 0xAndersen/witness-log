name: register-witness

# Register a running witness in registry/witnesses/ from its URL: fetch
# GET /, take `directory_entry`, validate it (including the live key
# cross-check), and commit the file to main. For a witness someone else
# runs, the same file arrives as a PR instead (deploy/witness/AGENT_OPERATOR.md).

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Base URL of the witness, e.g. https://1.2.3.4.sslip.io (GET / must answer)"
        required: true
        type: string
      project_operated:
        description: "true if the project (not an outside organisation) runs it; it then counts as the project bucket"
        required: false
        default: "false"
        type: string

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: fetch the directory entry
        shell: bash
        env:
          URL_IN: ${{ inputs.url }}
          PROJECT_OPERATED: ${{ inputs.project_operated }}
        run: |
          set -euo pipefail
          url="${URL_IN%/}"
          [[ "$url" =~ ^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/[A-Za-z0-9._~/-]*)?$ ]] || { echo "::error::url must be https://host[:port][/path]"; exit 1; }
          case "$PROJECT_OPERATED" in true|false) ;; *) echo "::error::project_operated must be true or false"; exit 1 ;; esac
          curl -fsS --max-time 20 "$url/" > info.json
          jq -e '.directory_entry.pubkey' info.json >/dev/null || { echo "::error::$url/ did not return a directory_entry"; cat info.json; exit 1; }
          jq --arg url "$url" --argjson po "$PROJECT_OPERATED" \
             '.directory_entry | .url = $url | .is_project_operated = $po' info.json > entry.json
          name=$(jq -r .name entry.json)
          slug=$(echo "$name" | tr '/' '-' | tr -c 'A-Za-z0-9._-\n' '-' | sed 's/-\{2,\}/-/g; s/^-//; s/-$//')
          echo "SLUG=$slug" >> "$GITHUB_ENV"
          mkdir -p registry/witnesses
          cp entry.json "registry/witnesses/$slug.json"
          echo "entry for $name -> registry/witnesses/$slug.json"
          cat "registry/witnesses/$slug.json"
      - name: validate (schema + live key and operator_org cross-check)
        run: python3 registry/validate.py --require-live
      - name: commit
        shell: bash
        run: |
          git config user.name "0xAndersen"
          git config user.email "321999970+0xAndersen@users.noreply.github.com"
          git add "registry/witnesses/$SLUG.json"
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "registry: witness $SLUG ($(jq -r .operator_org "registry/witnesses/$SLUG.json"))"
          git push
      - name: summary
        shell: bash
        run: |
          {
            echo "## Registered"
            echo '```json'; cat "registry/witnesses/$SLUG.json"; echo '```'
            echo "Build a directory from the registry: \`python3 registry/build_directory.py > trusted.json\`"
          } >> "$GITHUB_STEP_SUMMARY"
