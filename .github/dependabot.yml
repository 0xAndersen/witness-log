# Keep CI actions current, grouped into one monthly PR. Rust dependencies
# get security updates only (enable them under Settings -> Code security):
# a version-update PR raises the minimum versions in Cargo.toml, which for
# a library only narrows what downstream crates can resolve and can break
# the declared MSRV (rust-version = "1.75").
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
