# A witness behind a TLS-terminating reverse proxy (Caddy). Replace
# witness.example with your hostname; Caddy obtains the certificate.
#
#   docker compose -f deploy/witness/docker-compose.yml run --rm witness \
#       witness init /state --name witness.example/w1 --org "Example Org" \
#       --url https://witness.example --compute hetzner
#   docker compose -f deploy/witness/docker-compose.yml up -d
#
# Back up the `state` volume as one unit (key + logs/), never the key alone.

services:
  witness:
    build:
      context: ../..
      dockerfile: deploy/witness/Dockerfile
    restart: unless-stopped
    # Only the proxy reaches the witness, and every client arrives from the
    # proxy's address, so the per-IP limits are raised here (the image's
    # default command keeps them, for direct exposure).
    command: ["witness", "serve", "/state", "--listen", "0.0.0.0:7380", "--open-enrollment",
              "--max-conns-per-ip", "256", "--enroll-rate", "6000"]
    volumes:
      - state:/state
    expose:
      - "7380"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    command: >
      caddy reverse-proxy
        --from witness.example
        --to witness:7380
    depends_on: [witness]

volumes:
  state:
  caddy-data:
  caddy-config:
