#cloud-config
# witness-log witness, zero-touch. Paste this whole file into the VM's
# "cloud-init" / "user data" box when creating it (Oracle Cloud: Advanced
# options → Management → "Paste cloud-init script"; GCP: "Automation →
# Startup script" does NOT take cloud-config, use the metadata key
# `user-data`; Hetzner/DigitalOcean/Vultr: "Cloud config" / "User data").
#
# Edit the three values under `write_files` → /etc/witness-log/env before
# pasting (the script refuses to start while ORG is the placeholder).
# Everything else is automatic:
#   - refuses to run while ORG is still the placeholder below: the label
#     is what verifiers score independence by, so a default would be worse
#     than no witness
#   - installs the witness-log release binary for this CPU, checksum-verified
#     (if a release has no binary for this CPU, compiles that version from
#     crates.io instead, which takes several minutes)
#   - creates a locked-down system user and initialises ONE witness
#   - serves it under systemd (hardened unit fetched from the repo at the
#     release tag WL_REF, not from a moving branch)
#   - puts Caddy in front: plain http on :80 for any hostname at once, and
#     automatic TLS on <public-ip>.sslip.io (or your own HOST) once the
#     certificate is issued. Caddy is taken from its GitHub release and
#     checked against the checksum file that release publishes
#     (caddy_<ver>_checksums.txt, SHA-512); on a mismatch, or if Caddy
#     cannot be fetched, the witness still runs on 127.0.0.1:7380 without
#     TLS and the log says so in capitals
#   - skips the public-IP lookup when HOST is set (nothing leaves the box
#     that does not need to)
#   - opens 80/443 in the host firewall (Oracle images ship iptables rules
#     that block everything but 22; this handles that)
#   - writes the directory entry to /var/lib/witness-log/w1/entry.json and
#     serves it at GET / so it can be registered from its URL
#
# After first boot (3–5 min), check:   curl -s http://<public-ip>/health  → ok
# Then register it: open a PR adding GET /'s directory_entry to
# registry/witnesses/ (or ask the maintainers to run the register-witness
# workflow with your URL). Progress: /var/log/witness-log-bootstrap.log.
#
# Backups: /var/lib/witness-log/w1 is the whole witness (key + memory). Snapshot
# the directory as one unit; never restore the key without logs/. OPERATORS.md §3.
#
# .github/workflows/cloud-init-test.yml boots this file in a real Ubuntu
# cloud image under QEMU/KVM and checks every step above except the
# public certificate.

package_update: true
packages: [curl, ca-certificates, jq, iptables-persistent]

write_files:
  - path: /etc/witness-log/env
    permissions: "0644"
    content: |
      # ---- edit these three ----
      ORG="Your Organisation"        # the organisation that controls this machine; the independence label
      NAME_BASE="yourorg"            # key name becomes <NAME_BASE>.witness/<HOST>; letters, digits, dashes
      COMPUTE="oracle-cloud"         # where it runs: oracle-cloud, gcp, aws, hetzner, homelab, ...
      # ---- optional ----
      HOST=""                        # your DNS name for this box; empty = <public-ip>.sslip.io (no DNS needed; this needs the public-IP lookup)
      WL_VERSION="latest"            # a tag like v0.4.0 to pin, or latest
      WL_REF="v0.4.3"                # repo tag the systemd unit is fetched from; keep it a release tag, not a branch
      CADDY_VERSION="2.11.7"         # Caddy release to install, checked against that release's checksum file

  - path: /usr/local/sbin/witness-log-bootstrap
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      . /etc/witness-log/env
      WL_REF="${WL_REF:-v0.4.3}"
      CADDY_VERSION="${CADDY_VERSION:-2.11.7}"
      REPO=0xAndersen/witness-log
      log(){ echo "[witness-log-bootstrap] $*"; }

      # 0. refuse the placeholder organisation. ORG is the independence
      #    label verifiers score by; a witness labelled with the default
      #    would share a bucket with every other unedited paste.
      if [ -z "${ORG:-}" ] || [ "$ORG" = "Your Organisation" ] || [ "$ORG" = "unspecified" ]; then
        log "ERROR: ORG in /etc/witness-log/env is still the placeholder (\"${ORG:-}\"). Edit it to the organisation that controls this machine, then run: /usr/local/sbin/witness-log-bootstrap"
        exit 1
      fi

      # 1. public IP and hostname. Only looked up when HOST is empty: with a
      #    HOST set nothing needs to leave the box to learn its own address.
      #    The lookup services are a convenience; without them (offline,
      #    egress-filtered) fall back to the address of the interface that
      #    holds the default route.
      if [ -z "${HOST}" ]; then
        IP=$(curl -fsS --max-time 10 https://api.ipify.org 2>/dev/null || curl -fsS --max-time 10 https://ifconfig.me 2>/dev/null || true)
        if ! [[ "$IP" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          IP=$(ip -4 route get 1.1.1.1 2>/dev/null | awk '{for(i=1;i<=NF;i++) if($i=="src"){print $(i+1); exit}}')
          IP=${IP:-127.0.0.1}
          log "public IP lookup failed; using interface address $IP (set HOST if this box is behind NAT)"
        fi
        HOST="${IP}.sslip.io"
        log "ip $IP, host $HOST"
      else
        log "host $HOST (set in env; public-IP lookup skipped)"
      fi

      # 2. release binary for this CPU, checksum-verified
      ARCH=$(uname -m)   # x86_64 | aarch64
      if [ "$WL_VERSION" = "latest" ]; then
        WL_VERSION=$(curl -fsS "https://api.github.com/repos/${REPO}/releases/latest" | jq -r .tag_name)
      fi
      ASSET="witness-log-${WL_VERSION}-${ARCH}-unknown-linux-gnu"
      BASE="https://github.com/${REPO}/releases/download/${WL_VERSION}"
      TMP=$(mktemp -d); cd "$TMP"
      if curl -fsSLO "$BASE/$ASSET.tar.gz"; then
        curl -fsSLO "$BASE/SHA256SUMS"
        grep " ${ASSET}.tar.gz\$" SHA256SUMS | sha256sum -c -
        tar xzf "$ASSET.tar.gz"      # the archive is flat: ./witness-log, LICENSE, README.md
        install -m 0755 ./witness-log /usr/local/bin/witness-log
      else
        log "release ${WL_VERSION} has no ${ARCH} Linux binary; compiling witness-log-cli ${WL_VERSION#v} from crates.io (several minutes)"
        DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential >/dev/null
        export RUSTUP_HOME=/opt/rustup CARGO_HOME=/opt/cargo
        curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --no-modify-path >/dev/null
        /opt/cargo/bin/cargo install --locked --root /usr/local witness-log-cli --version "${WL_VERSION#v}"
      fi
      log "installed $(witness-log --version)"

      # 3. system user and ONE witness
      id witness-log >/dev/null 2>&1 || useradd --system --home /var/lib/witness-log --shell /usr/sbin/nologin witness-log
      install -d -o witness-log -g witness-log -m 0700 /var/lib/witness-log
      if [ ! -f /var/lib/witness-log/w1/witness.key ]; then
        # shellcheck disable=SC2024  # root captures the entry on purpose
        sudo -u witness-log witness-log witness init /var/lib/witness-log/w1 \
          --name "${NAME_BASE}.witness/${HOST}" \
          --org "${ORG}" \
          --url "https://${HOST}" \
          --compute "${COMPUTE}" > /var/lib/witness-log/entry.json
        install -o witness-log -g witness-log -m 0644 /var/lib/witness-log/entry.json /var/lib/witness-log/w1/entry.json
        rm -f /var/lib/witness-log/entry.json
        log "witness initialised: $(jq -c . /var/lib/witness-log/w1/entry.json)"
      fi

      # 4. systemd unit from the repo (hardened), pinned to the release tag
      #    in WL_REF so a later change to a branch cannot alter what this
      #    box runs as root. Refuse a download that is not a unit file.
      curl -fsSL -o /etc/systemd/system/witness-log-witness.service.tmp \
        "https://raw.githubusercontent.com/${REPO}/${WL_REF}/deploy/witness/witness-log-witness.service"
      grep -q '^\[Service\]' /etc/systemd/system/witness-log-witness.service.tmp
      grep -q '^ExecStart=.*witness-log' /etc/systemd/system/witness-log-witness.service.tmp
      mv /etc/systemd/system/witness-log-witness.service.tmp /etc/systemd/system/witness-log-witness.service
      log "systemd unit from ${REPO}@${WL_REF}"
      systemctl daemon-reload
      systemctl enable --now witness-log-witness
      for _ in $(seq 1 20); do curl -fsS http://127.0.0.1:7380/health >/dev/null 2>&1 && break; sleep 1; done
      log "witness serving on 127.0.0.1:7380: $(curl -s http://127.0.0.1:7380/health)"

      # 5. Caddy in front. Not fatal: the witness is already serving, and a
      #    box without Caddy can still be put behind any other proxy. A
      #    checksum mismatch is reported loudly and leaves the box without
      #    TLS rather than running an unverified binary as a system service.
      echo "$HOST" > /etc/witness-log/host
      if ! /usr/local/sbin/witness-log-caddy "$HOST" "$ARCH" "$CADDY_VERSION"; then
        log "WARNING: NO TLS. Caddy was not installed (download failed or its checksum did not match the release's checksum file)."
        log "WARNING: the witness runs on 127.0.0.1:7380 only; put any reverse proxy in front, or fix the cause and re-run: /usr/local/sbin/witness-log-caddy $HOST $ARCH $CADDY_VERSION"
      fi

      # 6. host firewall: Oracle's Ubuntu images reject everything but 22 in
      #    iptables; most other images have no rules. Both end up open.
      for p in 80 443; do
        iptables -C INPUT -p tcp --dport $p -j ACCEPT 2>/dev/null || iptables -I INPUT 1 -p tcp --dport $p -j ACCEPT || true
        ip6tables -C INPUT -p tcp --dport $p -j ACCEPT 2>/dev/null || ip6tables -I INPUT 1 -p tcp --dport $p -j ACCEPT || true
      done
      netfilter-persistent save >/dev/null 2>&1 || true
      if command -v ufw >/dev/null && ufw status 2>/dev/null | grep -q "Status: active"; then
        ufw allow 22/tcp >/dev/null; ufw allow 80/tcp >/dev/null; ufw allow 443/tcp >/dev/null
      fi

      # 7. report
      sleep 3
      echo "----------------------------------------------------------------"
      echo "witness-log witness is up."
      echo "  health:    http://${HOST}/health      (https once the certificate is issued, ~1 min)"
      echo "  entry:     http://${HOST}/            (JSON, field directory_entry)"
      echo "  register:  PR adding directory_entry to registry/witnesses/, or ask for register-witness with url = https://${HOST}"
      echo "  backup:    /var/lib/witness-log/w1 as ONE unit (key + logs/)"
      echo "----------------------------------------------------------------"
      curl -s "http://127.0.0.1:7380/" | jq .
      log "done"

  - path: /usr/local/sbin/witness-log-caddy
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Caddy in front of the witness: plain http on :80 for any Host (works
      # at once, behind NAT, and before a certificate exists), TLS for $1.
      # The binary comes from Caddy's GitHub release $3 and is accepted only
      # if it matches that release's published checksum file. The file Caddy
      # publishes (caddy_<ver>_checksums.txt) holds SHA-512 digests, so that
      # is the digest compared. Exit 1 on any mismatch so the caller says so.
      set -euo pipefail
      HOST=$1; ARCH=$2; CV=${3:-2.11.7}
      CADDY_ARCH=$([ "$ARCH" = "aarch64" ] && echo arm64 || echo amd64)
      if ! command -v caddy >/dev/null; then
        D=$(mktemp -d)
        BASE="https://github.com/caddyserver/caddy/releases/download/v${CV}"
        TGZ="caddy_${CV}_linux_${CADDY_ARCH}.tar.gz"
        curl -fsSL --max-time 180 -o "$D/$TGZ" "$BASE/$TGZ"
        curl -fsSL --max-time 60 -o "$D/sums" "$BASE/caddy_${CV}_checksums.txt"
        WANT=$(grep " ${TGZ}\$" "$D/sums" | cut -d' ' -f1)
        if [ -z "$WANT" ]; then echo "caddy: no entry for $TGZ in caddy_${CV}_checksums.txt" >&2; rm -rf "$D"; exit 1; fi
        GOT=$(sha512sum "$D/$TGZ" | cut -d' ' -f1)
        if [ "$WANT" != "$GOT" ]; then
          echo "caddy: CHECKSUM MISMATCH for $TGZ (checksum file says $WANT, download is $GOT); refusing to install it" >&2
          rm -rf "$D"
          exit 1
        fi
        echo "caddy ${CV} ${TGZ}: checksum verified against caddy_${CV}_checksums.txt"
        tar xzf "$D/$TGZ" -C "$D" caddy
        install -m 0755 "$D/caddy" /usr/local/bin/caddy.tmp
        rm -rf "$D"
        /usr/local/bin/caddy.tmp version >/dev/null
        mv /usr/local/bin/caddy.tmp /usr/local/bin/caddy
        setcap cap_net_bind_service=+ep /usr/local/bin/caddy || true
      fi
      id caddy >/dev/null 2>&1 || useradd --system --home /var/lib/caddy --create-home --shell /usr/sbin/nologin caddy
      install -d -o caddy -g caddy /etc/caddy /var/lib/caddy
      cat > /etc/caddy/Caddyfile <<EOF
      {
          email admin@${HOST}
      }
      http://${HOST} {
          reverse_proxy 127.0.0.1:7380
      }
      http:// {
          reverse_proxy 127.0.0.1:7380
      }
      https://${HOST} {
          reverse_proxy 127.0.0.1:7380
      }
      EOF
      cat > /etc/systemd/system/caddy.service <<'EOF'
      [Unit]
      Description=Caddy (TLS in front of witness-log)
      After=network-online.target witness-log-witness.service
      Wants=network-online.target
      [Service]
      User=caddy
      Group=caddy
      ExecStart=/usr/local/bin/caddy run --environ --config /etc/caddy/Caddyfile
      ExecReload=/usr/local/bin/caddy reload --config /etc/caddy/Caddyfile --force
      Restart=always
      RestartSec=3
      AmbientCapabilities=CAP_NET_BIND_SERVICE
      ProtectSystem=full
      PrivateTmp=true
      [Install]
      WantedBy=multi-user.target
      EOF
      systemctl daemon-reload
      systemctl enable --now caddy
      for _ in $(seq 1 20); do curl -fsS http://127.0.0.1/health >/dev/null 2>&1 && exit 0; sleep 1; done
      echo "caddy did not answer on :80" >&2
      exit 1

runcmd:
  - [bash, -lc, "/usr/local/sbin/witness-log-bootstrap 2>&1 | tee /var/log/witness-log-bootstrap.log"]

final_message: "witness-log bootstrap finished after $UPTIME seconds; see /var/log/witness-log-bootstrap.log"
