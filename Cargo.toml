[workspace]
resolver = "2"
members = [
    "crates/witness-log-core",
    "crates/witness-log-network",
    "crates/witness-log-cli",
    "crates/witness-log-wasm",
]

[workspace.package]
version = "0.6.1"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/0xAndersen/witness-log"
authors = ["WitnessLog Contributors"]

[workspace.dependencies]
sha2 = "0.10"
zeroize = "1"
base64ct = { version = "1", features = ["alloc"] }
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: read every JSON number correctly rounded, as Go's
# strconv.ParseFloat and JavaScript's Number do. Without it serde_json's
# faster parser can be off by one unit in the last place and turned some
# finite literals near f64::MAX (1.7976931348623158e308) into "number out of
# range", so a dossier the Go and TypeScript verifiers read was refused here
# (SPEC.md §9; corpus/17_dossier_parsing.json). It only changes how numbers
# are read, and the bindings get it through witness-log-network.
serde_json = { version = "1", features = ["float_roundtrip"] }
hex = "0.4"
thiserror = "1"
